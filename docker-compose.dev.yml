# Development override file for docker-compose
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Frontend with development server (hot reload)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: myapp_frontend_dev
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=/api
      - VITE_APP_NAME=Happy Homes
      - VITE_APP_VERSION=1.0.0
      - VITE_ENABLE_ANALYTICS=false
      - VITE_ENABLE_ERROR_REPORTING=true
      - VITE_ENABLE_MAINTENANCE_MODE=false
      - CHOKIDAR_USEPOLLING=true  # For file watching in Docker
    ports:
      - "3001:3001"  # Development server port
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./postcss.config.js:/app/postcss.config.js:ro
      - /app/node_modules  # Anonymous volume for node_modules
    networks:
      - myapp_network
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package*.json

  # Backend API (already has hot reload configured)
  api:
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=household_services
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PORT=8001
      - JWT_SECRET=household-services-super-secret-jwt-key-2024
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:80,http://frontend:3001

  # Enable development services
  pgadmin:
    profiles: []  # Remove profile to always start in dev mode

  redis:
    profiles: []  # Remove profile to always start in dev mode