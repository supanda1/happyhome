services:
  # PostgreSQL Database - CUSTOM IMAGE FROM DOCKER HUB
  postgres:
    image: 1934/myapp_db_v1:latest
    container_name: myapp_db
    env_file: .env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d household_services"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Node.js TypeScript Backend API - FROM DOCKER HUB
  api:
    image: 1934/myapp_api_v1:latest
    container_name: myapp_api
    env_file: .env.production
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    restart: unless-stopped

  # React Frontend Application - FROM DOCKER HUB
  frontend:
    image: 1934/myapp_frontend_v1:latest
    container_name: myapp_frontend
    env_file: .env.production
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - myapp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  myapp_network:
    driver: bridge
    name: myapp_net
