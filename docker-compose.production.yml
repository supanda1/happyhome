services:
  # PostgreSQL Database - CUSTOM IMAGE FROM DOCKER HUB
  postgres:
    image: 1934/myapp_db_v1:latest
    container_name: myapp_db
    environment:
      POSTGRES_DB: household_services
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d household_services"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Migration Service - NOT NEEDED (schema included in custom DB image)

  # Node.js TypeScript Backend API - FROM DOCKER HUB
  api:
    image: 1934/myapp_api_v1:latest
    container_name: myapp_api
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=household_services
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_SSL=false
      - PORT=8001
      - JWT_SECRET=household-services-super-secret-jwt-key-2024
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:80,http://frontend:80
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    restart: unless-stopped

  # React Frontend Application - FROM DOCKER HUB
  frontend:
    image: 1934/myapp_frontend_v1:latest
    container_name: myapp_frontend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
      - VITE_APP_NAME=Happy Homes
      - VITE_APP_VERSION=1.0.0
      - VITE_ENABLE_ANALYTICS=false
      - VITE_ENABLE_ERROR_REPORTING=true
      - VITE_ENABLE_MAINTENANCE_MODE=false
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - myapp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  myapp_network:
    driver: bridge
    name: myapp_net