<!DOCTYPE html>
<html>
<head>
    <title>API Debug Test</title>
</head>
<body>
    <h1>Frontend API Connection Test</h1>
    <div id="results"></div>
    
    <script>
        const API_BASE_URL = 'https://virtuous-rebirth-production-3277.up.railway.app';
        
        async function testAPI() {
            const results = document.getElementById('results');
            
            try {
                // Test categories
                console.log('Testing categories API...');
                const categoriesResponse = await fetch(`${API_BASE_URL}/categories`);
                const categoriesData = await categoriesResponse.json();
                
                results.innerHTML += `<h2>Categories API Test:</h2>`;
                results.innerHTML += `<p>Status: ${categoriesResponse.status}</p>`;
                results.innerHTML += `<p>Response: <pre>${JSON.stringify(categoriesData, null, 2)}</pre></p>`;
                
                // Test services  
                console.log('Testing services API...');
                const servicesResponse = await fetch(`${API_BASE_URL}/services`);
                const servicesData = await servicesResponse.json();
                
                results.innerHTML += `<h2>Services API Test:</h2>`;
                results.innerHTML += `<p>Status: ${servicesResponse.status}</p>`;
                results.innerHTML += `<p>Response: <pre>${JSON.stringify(servicesData, null, 2)}</pre></p>`;
                
            } catch (error) {
                results.innerHTML += `<h2>Error:</h2><p>${error.message}</p>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
