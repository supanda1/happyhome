version: '3.8'

services:
  # PostgreSQL Database - First to start
  postgres:
    image: postgres:15-alpine
    container_name: myapp_db
    environment:
      POSTGRES_DB: household_services
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d household_services || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Dedicated Migration Container - Runs ONLY database setup
  migration:
    build:
      context: .
      dockerfile: Dockerfile.migration
    container_name: myapp_migration
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=household_services
      - DB_USER=postgres
      - DB_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    restart: "no"  # Run once and exit
    profiles:
      - migration

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: myapp_redis
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Node.js TypeScript Backend API - Starts AFTER migration completes
  api:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: myapp_api
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=household_services
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PORT=8001
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000,http://localhost:3002
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - /app/node_modules  # Anonymous volume for node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package*.json

  # Migration Health Checker - Ensures migration completed before API starts
  migration-checker:
    image: postgres:15-alpine
    container_name: myapp_migration_checker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=household_services
      - DB_USER=postgres
      - DB_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    restart: "no"
    command: |
      sh -c "
        echo 'Waiting for migration to complete...';
        for i in \$$(seq 1 60); do
          if PGPASSWORD=password psql -h postgres -U postgres -d household_services -tAc \"SELECT 1 FROM migration_status WHERE migration_name='000_complete_setup' LIMIT 1;\" 2>/dev/null | grep -q 1; then
            echo '✅ Migration completed successfully!';
            exit 0;
          fi;
          echo \"Attempt \$$i/60: Migration not complete yet, waiting 5s...\";
          sleep 5;
        done;
        echo '❌ Migration timeout - check migration container logs';
        exit 1;
      "

  # pgAdmin for database management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: myapp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    profiles:
      - development
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  myapp_network:
    driver: bridge