services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: myapp_db
    environment:
      POSTGRES_DB: household_services
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./migrations/001_comprehensive_setup.sql:/docker-entrypoint-initdb.d/02-complete-setup.sql
      - ./migrations:/docker-entrypoint-initdb.d/migrations
      - ./scripts:/docker-entrypoint-initdb.d/scripts
    networks:
      - myapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d household_services"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Node.js TypeScript Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: myapp_api
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=household_services
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PORT=8001
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000,http://localhost:3002
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - /app/node_modules  # Anonymous volume for node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package*.json

  # pgAdmin for database management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: myapp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - myapp_network
    profiles:
      - development


volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  myapp_network:
    driver: bridge