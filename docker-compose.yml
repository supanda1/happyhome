services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: myapp_db
    environment:
      POSTGRES_DB: household_services
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/final_complete_setup.sql:/docker-entrypoint-initdb.d/01-complete-setup.sql
    networks:
      - myapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d household_services"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Migration Service - Ensures database has all required data
  migrations:
    image: postgres:15-alpine
    container_name: myapp_migrations
    environment:
      - PGPASSWORD=password
    volumes:
      - ./backend/migrations:/migrations
      - ./backend/scripts/run-migrations.sh:/run-migrations.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myapp_network
    command: |
      sh -c "
        chmod +x /run-migrations.sh &&
        /run-migrations.sh
      "
    restart: "no"  # Only run once per startup

  # Node.js TypeScript Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.node
    container_name: myapp_api
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=household_services
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PORT=8001
      - JWT_SECRET=household-services-super-secret-jwt-key-2024
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:80,http://frontend:80
    ports:
      - "8001:8001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/scripts:/app/scripts
      - ./public:/app/public  # Mount public images directory
      - /app/node_modules  # Anonymous volume for node_modules
    command: sh -c "echo 'Waiting for database to be ready...' && sleep 10 && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - myapp_network
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/package*.json

  # React Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myapp_frontend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
      - VITE_APP_NAME=Happy Homes
      - VITE_APP_VERSION=1.0.0
      - VITE_ENABLE_ANALYTICS=false
      - VITE_ENABLE_ERROR_REPORTING=true
      - VITE_ENABLE_MAINTENANCE_MODE=false
    ports:
      - "3001:80"  # Map host port 3001 to container port 80
    depends_on:
      - api
    networks:
      - myapp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:
  postgres_data:
    driver: local

networks:
  myapp_network:
    driver: bridge
    name: myapp_net